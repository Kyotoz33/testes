name: Build Keybind Helper
on:
  push:
    paths: ['keybind-helper/**', '.github/workflows/build-keybind-helper.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keybind-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: keybindhelper-jar
          path: keybind-helper/build/libs/*.jar
