# Netlify hospeda só o site (parte visual). A API e o bot ficam na VPS.
# No painel do Netlify: Site configuration > Environment variables > API_URL = https://api.seudominio.com
[build]
  publish = "dist"
  command = '''
    mkdir -p dist
    cp index.html admin.html app.js admin.js bg.js badges.js config.js style.css admin.css dist/
    if [ -n "$API_URL" ]; then sed -i "s|apiUrl: \"[^\"]*\"|apiUrl: \"$API_URL\"|" dist/config.js; fi
  '''

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
