# Netlify hospeda o site E a API (funções em netlify/functions + armazenamento Blobs).
# O status do Discord é enviado pelo bot de alguém (ver bot-presence/LEIA-ME.md).
# Variáveis no Netlify (Site configuration > Environment variables):
#   ADMIN_PASSWORD  senha do painel (você escolhe)
#   SESSION_SECRET  texto longo aleatório (assina o login)
#   PRESENCE_KEY    chave que o bot usa para enviar o status
# (API_URL só é preciso se a API ficar em outro endereço, ex.: o servidor da pasta server/ numa VPS)
[build]
  publish = "dist"
  command = '''
    mkdir -p dist
    cp index.html admin.html app.js admin.js bg.js badges.js config.js style.css admin.css dist/
    if [ -n "$API_URL" ]; then sed -i "s|apiUrl: \"[^\"]*\"|apiUrl: \"$API_URL\"|" dist/config.js; fi
  '''

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
